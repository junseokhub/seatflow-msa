spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

  # 운영 설정(application.yml)은 gitignore 라 CI·새 체크아웃엔 없다 → 테스트가 직접 채운다
  kafka:
    bootstrap-servers: localhost:9092   # 프로듀서는 지연 연결이라 실제 브로커 없이 컨텍스트가 뜬다

